plugins {
    id 'com.android.application'
}

def signingValues = [
    path: System.getenv("ANDROID_KEYSTORE_PATH"),
    storePassword: System.getenv("ANDROID_KEYSTORE_PASSWORD"),
    alias: System.getenv("ANDROID_KEY_ALIAS"),
    keyPassword: System.getenv("ANDROID_KEY_PASSWORD")
]
def hasReleaseSigning = signingValues.values().every { it }

android {
    namespace 'com.messmanagement.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.messmanagement.app"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingValues.path)
                storePassword signingValues.storePassword
                keyAlias signingValues.alias
                keyPassword signingValues.keyPassword
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    testImplementation 'junit:junit:4.13.2'
}
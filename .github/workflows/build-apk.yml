name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Release Keystore
        working-directory: android-app/app
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkey -v -keystore release.keystore -alias messmanagement -keyalg RSA -keysize 2048 -validity 10000 -storepass messmanagement123 -keypass messmanagement123 -dname "CN=Mess Management, OU=Development, O=MessApp, L=Dhaka, ST=Dhaka, C=BD"
          fi

      - name: Print Keystore SHA Fingerprints
        working-directory: android-app/app
        run: |
          echo "### 🔑 Android App Signing Fingerprints" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore release.keystore -alias messmanagement -storepass messmanagement123 | grep -E "SHA1|SHA256" | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build Signed Release APK
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PATH: "release.keystore"
          ANDROID_KEYSTORE_PASSWORD: "messmanagement123"
          ANDROID_KEY_ALIAS: "messmanagement"
          ANDROID_KEY_PASSWORD: "messmanagement123"
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mess-Management-Release-APK
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths: [ 'android-app/**', '.github/workflows/build-apk.yml' ]
  pull_request:
    paths: [ 'android-app/**', '.github/workflows/build-apk.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check Android and build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android Build Tools and Platform
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build APK
        working-directory: android-app
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mess-Management-Test-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
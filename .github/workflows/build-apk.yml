name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android Build Tools and Platform
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Release Keystore
        working-directory: android-app/app
        run: |
          keytool -genkey -v -keystore release.keystore -alias messmanagement -keyalg RSA -keysize 2048 -validity 10000 -storepass messmanagement123 -keypass messmanagement123 -dname "CN=Mess Management, OU=Development, O=MessApp, L=Dhaka, ST=Dhaka, C=BD"

      - name: Build Signed Release APK
        working-directory: android-app
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mess-Management-Release-APK
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error